; PlatformIO Project Configuration File
[platformio]
default_envs = lolin_s3_mini
src_dir = src
build_dir = C:/tmp/pa_build
; Limit parallel compile jobs to avoid cc1plus OOM on large ThorVG SVG files.
; ThorVG's SVG translation units are extremely large and exhaust Windows RAM
; when compiled in parallel. 2 jobs = manageable peak usage.
build_jobs = 4

[env:lolin_s3_mini]
platform = espressif32@6.3.2
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; Native-USB CDC on this board drops the port mid-flash at the default 460800
; upload baud on some Windows USB stacks (reproducible failure ~18-19% into
; the write, same offset every time). Forcing a lower, more conservative rate
; avoids the disconnect.
upload_speed = 115200
; Baud rate change alone didn't fix it (same flash offset failed at both 460800
; and 115200) — bypass the flasher stub entirely and use the ROM bootloader for
; the whole transfer instead.
upload_flags = --no-stub

; ── Flash / partition / PSRAM configuration for ESP32-S3-N16R16 ──────────────
; N16R16 = 16 MB QIO flash + 16 MB OPI PSRAM. qio_opi is required for the OPI
; PSRAM to initialise; without it the bootloader may fail on this variant.
board_build.flash_size      = 16MB 
board_upload.flash_size     = 16MB
board_upload.maximum_size   = 16777216
board_build.partitions      = data/custom_partitions.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^6.21.5
  lvgl/lvgl@^9.5.0

extra_scripts = pre:scripts/inject_time.py

build_flags =
  -D DEBUG_SERIAL
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  ; Put the project-local lv_conf.h (include/lv_conf.h) on the GLOBAL include path
  ; so the lvgl LIBRARY — not just our src/ — compiles against it. Without this the
  ; library falls back to LVGL defaults (Lottie/fonts off → link errors). This makes
  ; our config survive a `pio` library reinstall, unlike the old .pio/libdeps copy.
  -I include
  ; NOTE: LV_TICK_CUSTOM was removed in LVGL v9. The tick source is now registered
  ; at runtime via lv_tick_set_cb(millis) in display_init(). Do not re-add these.